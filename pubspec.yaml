name: getinsta
description: GetInsta Flutter App

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  url_launcher: ^6.2.2
  http: ^1.1.0
  path_provider: ^2.1.1
  connectivity_plus: ^5.0.2
  permission_handler: ^11.1.0
  flutter_local_notifications: ^16.3.2
  fluttertoast: ^8.2.4
  open_file: ^3.3.2
  video_player: ^2.8.1
  chewie: ^1.7.4
  screen_brightness: ^0.2.2+1
  volume_controller: ^2.0.7
  pip_view: ^0.9.7
  shared_preferences: ^2.2.2
  audioplayers: ^5.2.1
  audio_service: ^0.18.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
